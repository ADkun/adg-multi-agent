# Key reference + manual-override template for dsh-adg-token-budget.
#
# IT IS NOT A READY-TO-PASTE MOUNT ENTRY ANY MORE. The mount row itself ships with the
# package: `plugin/dsh-adg-token-budget/cordis.patch.yml` — the BUNDLE patch layer
# (`dsh.bundle.patch` in `package.json`) — which the Loader inserts for every profile that
# selects `dsh-adg-token-budget` in its `dsh.profile.bundles`. Nothing has to be pasted into
# `$DSH_HOME/profiles/<profile>/cordis.patch.yml`, and the row is now visible as an
# installed bundle (`plugin_manager list_bundles`), which a hand-pasted entry never was.
#
# What this file is for now:
#   1. the documented key set — every key, its default, and why it exists;
#   2. a template for a deliberate PER-PROFILE OVERRIDE.
# A machine-level `$DSH_HOME/cordis.patch.yml` remains the one place this row must never
# appear: it is applied on top of every profile on the machine and it blocks saving from
# the Plugins page.
#
# OVERRIDE MEANS A WHOLE-BLOCK REPLACE, NOT A DEEP MERGE. A profile's own patch file is
# applied AFTER every bundle layer, and a patch that hits an existing id replaces that row's
# ENTIRE `config` object: any key you do not restate silently falls back to `DEFAULT_CONFIG`
# in `src/config.js`. So restate every key you want to keep, not just the one you want to
# change. The entry below keeps the historical `- insert:` shape so this file still parses as
# a patch and still diffs against the shipped row; to use it as an override, drop the
# `insert:` wrapper and key the row by id instead (`- id: adg-token-budget`).
# A `- insert:` entry LEFT over by the old hand-paste route is not a harmless duplicate either: it
# takes over the shipped row's `config:` the same way, and while it exists the row is no longer
# addressable by the Plugin Manager (`readOnlyReason: "unaddressable"`, and no `patchId`). The
# measured readings and the check for it are in the README's Install section; not repeated here.
#
# Hot reload follows the LAYER, not the key:
#   * A profile-layer `config:` OVERRIDE hot-reloads on a profile with `patchReload: live`
#     (the shipped `web` profile) — measured on this machine.
#   * Editing the BUNDLE-layer row (the deployed
#     `bundles/dsh-adg-token-budget/cordis.patch.yml`): **restarting `dsh` is the accepted
#     route, because nothing watches `bundles/`** — editing that file on its own triggers no
#     re-read. Editing the profile's own `cordis.patch.yml`, or the profile manifest, re-reads
#     the WHOLE patch stack and the bundle layer comes along with it: measured, the
#     `activation:` line at `2026-09-28T01:47:48.467Z` was written by a process that had started
#     before the migration, so bundle layers are NOT read only at startup. That is a fact about
#     what re-reads, not a licence to promise "this takes effect without a restart"; and whether
#     the bundle layer mounts after a COLD start is still unobserved.
#   * No reload of any kind re-`import`s a module the process already loaded, so replacing the
#     package's `src/` always needs a restart (measured; see the README's Install section).
# Deploy the code first, restart, confirm the new `activation:` line, and only then change the
# configuration.
#
# THE SHIPPED ROW IS ARMED — `enabled: true` with `dryRun: false`: selecting the bundle is the
# deliberate act, and the install scripts only select it. The `enabled: false` below is
# therefore NOT "installs inert by design" any more; it says only that THIS EXAMPLE IS INERT,
# so copying the file into a scratch profile cannot start injecting reminders into children
# that profile happens to delegate. Keep it for a per-profile override you want to install
# without effect; restate the whole block with your own values to arm one.
#
# The cumulative token budget is gone. This plugin injects NOTHING at a token
# threshold and never cancels a child: it only counts the steps a governed child
# enters and, at the tiers below, appends one optional convergence reminder.
# An output-shaped delegation (a document, a report, a long digest) needs the
# tokens it needs, so a threshold would truncate the deliverable instead of
# saving anything. A row that still carries `budgetTokens`, `softRatio`,
# `cacheReadWeight`, `softNudge` or `hardDryRun` loads fine — those keys are
# simply ignored.
#
# Every key under `config:` is optional; the commented values are the defaults. In an
# override row, "optional" is exactly the trap: leaving a key out resets it to that default.

- insert:
    - id: adg-token-budget
      name: 'dsh-adg-token-budget'
      config:
        enabled: false                   # master switch; false registers nothing at all
        # (the row the bundle ships is `enabled: true`)
        #
        # Which delegated children this plugin governs. A child counts as
        # delegated when its session header records delegationDepth > 0 (or its
        # runtime AgentOptions.subagentDepth does). Both are put through
        # Number.isSafeInteger(value) && value >= 0 first, so '1' (a string) is
        # depth 0, not 1. A child whose header has no agentPreset is NOT
        # governed — the plugin fails open there on purpose.
        # presets: ['adg']
        #
        # Whether the step checkpoints run: count the steps a governed child
        # ENTERS, and inject a convergence reminder when that count reaches each
        # stepTiers entry (once per tier per residency epoch; at most one
        # reminder message per step). `false` turns the whole feature off,
        # counting included, so a passing step allocates nothing. Use `dryRun`
        # to keep counting while injecting nothing.
        # stepNudge: true
        #
        # The step numbers the checkpoints fire on, ascending. A bare number
        # (`stepTiers: 24`) reads as a one-tier list. Anything unusable falls back
        # to this default; use `stepNudge: false` to switch them off on purpose.
        # Calibration: the measured DISTRIBUTION of 37 delegated children is
        # min 1 / p10 6 / p25 14 / median 39 / mean 51.7 / p75 61 / p90 103 / max
        # 329 steps, so a ladder anchored on the average asks too late — a quarter
        # of the population is already finished by step 14. This default is
        # therefore early and dense through step 24 (every 4-6 steps), then widens
        # geometrically. 34 of 37 children see at least one; a median child sees 6.
        # A reminder costs a few dozen tokens per later step, which is why
        # frequency is affordable: all 214 messages over that corpus are ~0.25% of
        # what those children spend.
        # stepTiers: [4, 8, 12, 18, 24, 32, 42, 55, 72, 95, 125, 165, 215, 280]
        #
        # Optional wording for a step checkpoint, replacing the built-in body
        # entirely (including the sentence the built-in adds on the last tier).
        # Blank or unusable values fall back to the built-in body rather than
        # leaving the checkpoint wordless; over 4000 characters is truncated.
        # The built-in body is a CHOICE, not an order — it says it is optional and
        # may be disregarded, names both branches (converge and report, or keep
        # working without trimming the plan), and asks the child to say which it
        # picked. An early, dense ladder is only safe because it can be ignored.
        # This key lives in `config:`, so changing the wording hot-reloads with
        # the row instead of needing a new package and a dsh restart.
        # stepText: null
        #
        # Calibration switch. true computes and logs every checkpoint decision it
        # would make but injects nothing and consumes nothing: the step is
        # delegated through next() as usual, no tier is marked fired (so turning
        # `dryRun` off still delivers that reminder), and the steps ARE still
        # counted — "which step would have been reminded" is the fact being
        # calibrated. Recommended first step. There is nothing destructive left to
        # keep dry.
        # dryRun: false
        #
        # Append the load-time activation line plus one line per decision EVENT
        # here (step checkpoint, dry-run decision, settle, and a "nudge could not
        # be delivered" note). A step with no checkpoint due writes nothing.
        # Absolute path, or null for no file logging. Each line is prefixed with
        # an ISO-8601 timestamp. The shipped row spells it
        # `logFile: !!js dshHomePath('adg-token-budget.log')`, which the Loader
        # evaluates to `$DSH_HOME/adg-token-budget.log` on every machine; a plain
        # string is still what to write here if you want a different file.
        # logFile: 'D:\dsh-adg-token-budget.log'
