# Ready-to-paste patch entry for dsh-adg-token-budget.
#
# Put this in ONE of:
#   $DSH_HOME/profiles/<profile>/cordis.patch.yml   -> that profile only
#   $DSH_HOME/cordis.patch.yml                      -> every profile on this machine
#
# A profile with `patchReload: live` (the shipped `web` profile) picks a `config:`
# change up without a restart — but ONLY a `config:` change: the live reload does
# not re-`import` a module the process already loaded, so replacing the package's
# `src/` needs a restart (measured; see the README's Install section). Deploy the
# code first, restart, confirm the new `activation:` line carries the newer
# fields, and only then turn `dryRun` off — an old build sitting on a new config
# silently ignores keys it does not know, `hardDryRun` included.
# `enabled: false` ships on purpose: install the plugin
# and flip this to `true` deliberately, in one step you can undo.
#
# Every key under `config:` is optional; the commented values are the defaults.

- insert:
    - id: adg-token-budget
      name: 'dsh-adg-token-budget'
      config:
        enabled: false                   # master switch; false registers nothing at all
        #
        # Which delegated children this plugin governs. A child counts as
        # delegated when its session header records delegationDepth > 0 (or its
        # runtime AgentOptions.subagentDepth does). Both are put through
        # Number.isSafeInteger(value) && value >= 0 first, so '1' (a string) is
        # depth 0, not 1. A child whose header has no agentPreset is NOT
        # governed — the plugin fails open there on purpose.
        # presets: ['adg']
        #
        # Cumulative budget per child agent session. Cumulative means the whole
        # session log: uncachedInputTokens + outputTokens
        #   + cacheReadTokens * cacheReadWeight + cacheWriteTokens.
        # Measured on the audit corpus: average child 1.73M, largest audited
        # child 5.22M, heaviest observed implementation delegation 7.65M — so
        # 3000000 already cancels ~5 of 22 audited children. Calibrate with
        # dryRun before arming.
        # budgetTokens: 3000000
        #
        # Soft stage threshold, as a fraction of budgetTokens in [0, 1].
        # At/above it the child is told to stop exploring and report now.
        # softRatio: 0.7
        #
        # Multiplier on cacheReadTokens. `1` counts every cached read as a full
        # token (the strictest, and the default); `0` ignores cached reads
        # entirely; a fraction discounts them.
        # cacheReadWeight: 1
        #
        # Whether the plugin injects a reminder into a step at all. Its two
        # triggers are the token soft stage and the step checkpoints; false
        # makes both log once instead of injecting, and keeps the hard cap.
        # softNudge: true
        #
        # Whether the STEP CHECKPOINTS run: count the steps a governed child
        # enters, and inject a convergence reminder when that count reaches each
        # stepTiers entry (once per tier per residency epoch; at most one
        # reminder message per step). false disables them entirely — including
        # the counting — and restores the token stage's zero-allocation
        # pass-through.
        # stepNudge: true
        #
        # The step numbers the checkpoints fire on, ascending. A bare number
        # (`stepTiers: 24`) reads as a one-tier list. Anything unusable falls back
        # to this default; use `stepNudge: false` to switch them off on purpose.
        # Calibration: the measured DISTRIBUTION of 37 delegated children is
        # min 1 / p10 6 / p25 14 / median 39 / mean 51.7 / p75 61 / p90 103 / max
        # 329 steps, so a ladder anchored on the average asks too late — a quarter
        # of the population is already finished by step 14. This default is
        # therefore early and dense through step 24 (every 4-6 steps), then widens
        # geometrically. 34 of 37 children see at least one; a median child sees 6.
        # A reminder costs a few dozen tokens per later step, which is why
        # frequency is affordable: all 214 messages over that corpus are ~0.25% of
        # what those children spend.
        # stepTiers: [4, 8, 12, 18, 24, 32, 42, 55, 72, 95, 125, 165, 215, 280]
        #
        # Optional wording for a step checkpoint, replacing the built-in body
        # entirely (including the sentence the built-in adds on the last tier).
        # Blank or unusable values fall back to the built-in body rather than
        # leaving the checkpoint wordless; over 4000 characters is truncated.
        # The built-in body is a CHOICE, not an order — it says it is optional and
        # may be disregarded, names both branches (converge and report, or keep
        # working without trimming the plan), and asks the child to say which it
        # picked. An early, dense ladder is only safe because it can be ignored.
        # This key lives in `config:`, so changing the wording hot-reloads with
        # the row instead of needing a new package and a dsh restart.
        # stepText: null
        #
        # Calibration switch. true computes and logs every decision it would
        # make (soft nudge, step checkpoints and hard cancel) but takes no
        # action: nothing is injected, agent.cancel is never called, the hard
        # stage still delegates through next(), and no once-per-epoch flag is
        # consumed — so arming afterwards still nudges. Recommended first step.
        # dryRun: false
        #
        # Calibration switch for the DESTRUCTIVE stage only. With `dryRun` off,
        # the hard stage logs what it would cancel and delegates through, while
        # the reminders are injected for real. This is the "arm the reminders,
        # keep the cancels on paper" setting. Ignored while `dryRun` is on,
        # which already covers every stage.
        # hardDryRun: false
        #
        # Append the load-time activation line plus one line per decision EVENT
        # here (soft nudge, step checkpoint, hard stop, dry-run decision, settle,
        # no-data note). A step that passes through writes nothing. Absolute
        # path, or null for no file logging. Each line is prefixed with an
        # ISO-8601 timestamp.
        # logFile: 'D:\dsh-adg-token-budget.log'
