#      **预防式**口径（"输出上限不可预测，所以大产出按规则 5 分段交付"，截断后的恢复归规则 7）——
#      初稿曾写成"你回一句『上一条我在 X 处被截断，接着说』"，那把机制说错了：截断在 `step()` 内、
