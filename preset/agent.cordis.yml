# The `Adg` agent preset: 调度智能体（dispatcher）+ 专家智能体名册（多智能体模式）。
#
# 复制自 `standard`，实质改动有十六处：
#   1. `persona` 的 prefix 写入了调度名册与分派规则 —— 这是"初始调度智能体"；
#   2. `delegation` 组里删掉了通用的 `subagent` / `subagent_fork` 行，改成
#      每个专家一行 `@deepseek-ai/dsh-tool-subagent`（persona + toolFilter 定义范围）；
#   3. `compaction-basic` / `tool-result-pruner` / `tool-web` 三行**刻意不覆盖**体积旋钮：
#      压缩阈值、单条工具结果截断、抓取与检索上限一律用插件出厂默认值
#      （0.8+0.16 / 8192+4096+1024 / 200000+8+4）。省 token 交给 host-plane 插件
#      `dsh-adg-token-budget`（只剩步数收敛检查点；按累计 token 介入的软/硬两档已移除），
#      不再靠截断工具结果与提前压缩 ——
#      实测那两样会把工具已经取到的事实切掉、让上下文信息失真。persona 里也不再写
#      「委派预算／成本纪律」—— 与成本有关的只剩第 7 条那两条**编排层**规则
#      （见 README「token 成本纪律」）。
#   4. 八个专家的 persona 末尾各留一句「收到检查点提醒时自己二选一（收敛汇报 or 继续做完
#      必需的工作）」—— 那是**子代理侧**的应对口径：插件只把提醒推进上下文，不管它怎么反应。
#      **调度 persona 里不写任何步数收敛政策**（原先写过、已删除：注入的那条消息自带
#      "这是你的第 N 步"和二选一，委派 prompt 再给一个步数区间只是重复同一个信号，而且那两个
#      数字会和 `stepTiers` 脱钩；"不要自己轮询步数"在出厂的 `job_output` / `subagent`
#      工具说明里已经讲过）。真正注入提醒的是 host-plane 插件 `dsh-adg-token-budget`
#      （默认阶梯 4 / 8 / 12 / 18 / 24 / 32 / 42 / 55 / 72 / 95 / 125 / 165 / 215 / 280 步，
#      消息署调度者的名，措辞是"可选提醒、由你选择"）。
#      提醒刻意不写成停止指令：早期、密集的检查点只有在它能被无视时才安全。
#   5. `agent_browser`（网页交互专员）多一条**权限前置闸门**：本机沙箱（`workspace-write` /
#      `read-only`）下 Chromium 系浏览器**根本起不来**（受限令牌禁止创建它内部 IPC 必需的
#      有名管道，见 README「浏览器专家需要完全权限」与 docs/evidence.md §11），而这件事
#      **无法从 preset 侧修**：父智能体不能给子智能体指定权限（`dsh-tool-subagent` 没有这类
#      字段），子代理自己也不能升权（委派时审批策略被钉成 `never`，`approveEscalation` 直接
#      判 rejected），沙箱与权限预设又都是 host-plane 的行。所以闸门只能做在调度侧：
#      调度 persona 规则 11 要求「派发 agent_browser 前先读自己上下文那行
#      `Current DSH file policy:`，不是 `danger-full-access` 就先 ask_user_question」，
#      专家 persona 则要求「命中失败签名立刻停手、如实报出，不许反复换参数重试」。
#      这是提示级的**流程**闸门，不是权限强制 —— 见 preset/design.md I11。
#   6. `agent_browser` 的登录墙／验证码走**人工介入协议**：子代理**不能**直接问用户 ——
#      `ask_user_question` 是按 preset 注册的（不在全局工具层），而且即使塞进 `allow` 名单，
#      `dsh-user-questions` 的 `ask()` 只认 live runtime root（`agents.roots()`），被委派的
#      子代理拿到 `DELEGATED_CALLER`，错误文本自己就写着「把未决问题写进子代理的最终结果」。
#      所以分工是：专家「把有头窗口开好 → 停手 → 如实报（卡在哪、端口与 profile、要用户做什么、
#      怎么重派）」，调度者（它是 root）用 `ask_user_question` 转达用户的四选一（已手动完成／
#      不想登录或验证／试过了还是被挡／换种方式），再决定重派／换方式／收手。
#      见 README「登录墙与验证码：人工介入协议」与 docs/evidence.md §12。
#      2026-09-27 补**事前**半条（实测缺口）：原规则只写了"专家报墙之后"怎么办，于是调度者
#      在派发前会自己加一句「不登录」（把它写进委派 prompt 或直接降级静态抓取）。现在明确
#      「请用户手动登录是本模式的正常路径」，派发前不得预先禁止登录，除非用户说过不想登录／
#      不想验证 —— 见 preset/design.md I12（下半）与 docs/evidence.md §12 的复核。
#   7. 调度 persona 新增两条**派发拓扑**规则（规则 6 / 规则 7）：同一实体 + 同一性质的
#      任务合并成一次委派（不为同一个代码库 / 文档库 / 站点各派一个"只看某个方面"的子代理 ——
#      每个子代理都会把同一份材料从头读一遍）；同一实体的后续任务优先用 `list_agents` +
#      `send_message` 接给**已经读过它**的那个专家、而不是新建一个（被恢复的子代理沿用自己
#      已持久化的会话：`dsh-subagent` 的 `coldResume` 直接从会话日志重建，源码注释写明
#      "no subagent provider is dispatched"，所以那份材料不必再读一遍）。
#      这两条约束的是"派给谁、派几次"（编排层），不是"单个专家能读多少、能写多少"
#      （那一层预算纪律已整体撤销，见上面第 3 条）—— 边界见 preset/design.md 的 I10 / I13，
#      量化与其它可选手段见 README「多智能体的 token 消耗：已落地与可选手段」。
#      **2026-09-29 补（按用户要求）：规则 7 的复用前提原先只是隐式的** —— 原写"（空闲的、以及已结束
#      但可恢复的都能接）"，没说"正在工作的别用它"，而模型侧 `send_message` **恒为 steer**，于是
#      调度者把"复用同一位专家"执行成了"向正在工作的它发消息"、插进它当前任务那一轮。现在规则 7
#      要求先看 `list_agents` 的 status 再分三种情形 —— 机制依据见下面第 14 条。
#   8. 调度 persona 再加两条**编排层**规则：规则 13 —— 大范围改动先让只读的 `agent_researcher`
#      出 `path:line` 清单，再让 `agent_coder` 按位改（定位与改动性质不同，本来就分两步）；
#      规则 14 —— 跨专家传递大材料走 digest：默认塞进委派 prompt（零文件），长到撑大调度者
#      上下文时才落成**平台临时根**下的文件工件，后续委派只传路径，**任务结束即删**并如实
#      报告删除结果，`read-only` 下不造工件、也绝不写进用户工作区（散落的中间文件会被误提交）。
#      同时把规则 11 / 12（浏览器权限闸门 + 人工介入）**只压缩措辞、不放宽语义**：删掉的是与
#      `agent_browser` persona 重复的失败签名与根因复述（两条 1281 → 812 字符，占 prefix 块
#      35.6% → 20.0%），`danger-full-access` 判定、`ask_user_question` 三选项与四分支处置全部保留
#      —— 那正是 I11 / I12 的两半。（当时一并保留的"同一条路径至多一轮"已于 2026-09-27 按用户
#      要求**删除**：人工介入默认不设次数上限，只有用户自己要求「不要打扰」或「只介入一轮」时
#      才受限 —— 见规则 16 与 `preset/design.md` I12。）
#   9. 调度 persona 再补"少做不该做的"一层：规则 5 由"四项内容"改为**五项必填**（加**验收标准**
#      与**本次不做**）、规则 6 把"实体"锚点从"检索到的材料"改成**"委派最终服务的那条需求 /
#      那个对象"**、新增规则 15**必要性闸门 + 强制挂号**。来源是实测的旁路委派：用户要"便携小巧
#      的录音笔"，调度者为"录音合规性"单独开了一个子代理 —— 四条编排层规则解决的是"不重复读"，
#      这一层解决"少读不该读的"。代价 +534 字符（prefix 块 4050 → 4584，≈130 token/步），
#      但**少开一个子代理就值回票价**（单个子代理实测均值 ≈1.73M）；未纳入的旁路必须在最终交付里
#      挂号「未纳入本次：X（可能影响 Y，未调研）」，**不许静默丢掉**（那比不做规则更糟）。
#  10. 调度 persona 补**输出 / 交接纪律**：规则 5 加"五项分字段写 + 期望产出里写明返回结构"，规则 10
#      由一句话扩成**四条去冗余纪律**。来源是"输出只占账单 1%，但它会变成上下文"这一算术（实测
#      §2：输出 0.9M / cache-read 85.1M）—— 写下的每个字都会在后续每一步作为 cache-read 重发，
#      所以被乘数最大的是两件**交接件**（委派 prompt、专家返回结果），不是最终答复的措辞。
#      纪律一律写成**禁止式**（不回贴原文 / 不重复 / 不转述过程 / **未验证必填**），**不写字数上限**
#      —— 后者会精确退化成已撤销的那层（截断会切掉工具已经取到的事实）。代价 +236 字符
#      （prefix 块 4584 → 4820）。
#  11. `agent_browser` 的浏览器操作收敛到仓库里的 `browser/` 工具链（`cli.mjs` 一个入口，零依赖）：
#      规范 profile 固定在 `<DSH_HOME>/browser-profile`、与工作区无关 —— 旧写法是"放工作区里一个
#      固定目录"，工作区一换 profile 就换、登录态当场清零，这正是"浏览器代理经常被登录拦住"的
#      直接成因。`launch` 幂等（实例活着就复用、不重启），`close` 是唯一能关浏览器的入口，
#      也是登录态落盘的时刻（有头启动 → 登录一次 → 跨会话复用，见 docs/evidence.md §13）。
#      工具链还负责**标签页卫生**：一次性读取自己开的临时标签读完就收（`--keep` 可留），
#      存量清理靠 `close-tab --match <站点>`，且拒绝关到只剩 0 个页面（那等于绕过 `close`）。
#      工具链的契约与不变量见 browser/design.md（I1 / I3 / I8 / I9 / I10）。I11 / I12 那两半不改语义。
#  12. 名册新增第 9 个专家行 `agent_general`（全功能智能体，交接专用）：**只在用户显式要求**
#      「交给子代理 / 另开一个上下文 / 换个智能体接手」时派发，用途是**上下文隔离**（把一整件
#      工作交接出去，等价于"上层把活交给下一个智能体、另开一个上下文"）。它拿的是本 preset 里
#      最全的叶子工具集（文件、命令、联网、技能、待办、交付物 + `send_message`），但**刻意不含**
#      任何 `agent_*` 名册行与通用 `subagent` / `subagent_fork` / `workflow` / `ralph` ——
#      即它是**叶子**，不会再往下委派。三个理由：① 委派一跳可达（红线 1）才让链路可追踪 ——
#      调度者的 `list_agents` 只列直接子级、`send_message` 只到直接父/子，孙代理对调度者**不可见、
#      不可 steer**；② 编排层规则（规则 6 同实体合并 / 规则 15 必要性闸门 / digest 中转）只作用于
#      调度者自己那一次委派，一旦它再委派，这些纪律整段失效，而同一份材料会被再读一遍
#      （实测 91% 的提示 token 是 cache-read）；③ 用户要的是"一个独立上下文把活做完"，
#      不是"再长出一棵树"。**技术上它当然能委派**（子代理会 `composeFrom` 继承整套组合，
#      把名册行写进它的 `allow` 就生效；深度上限是该行的 `maxDepth`，默认 3）——这是一次
#      **刻意的能力裁剪**，不是能力缺失，所以 persona 里明确写了"越界时回报需要 agent_X"。
#      "结束本次会话并回报上级"这条协议**由运行时自动提供**（源码依据：`dsh-subagent` 的
#      `withContinuableReturnGuidance`，只在子代理**看得见 `send_message`** 时注入）：它的任务
#      末尾会被自动附上「Your parent agent id is …，结束前用 send_message 把结果回报给它」，
#      而它每一轮的 final message 还会作为 settlement notice 的 closing message 回到调度者。
#      这就是我们把它做成叶子的补偿：**不用递归也能交接回来**。
#  13. 调度 persona 规则 8 补"委派必须走后台"一条（2026-09-28 按用户要求）：**只有后台的
#      continuable 子代理才是"活的"** —— 用户能在界面上手动给它发消息、随时停它，调度者也能按
#      规则 7 用 `list_agents` + `send_message` 接续复用（这正是本 preset 的"子代理复用"那半）。
#      源码依据：`run_in_background: false` 不是"前台等结果"，而是**换执行路径** —— 非后台分支走
#      `dsh-tool-subagent` 的 `settleForegroundRun(subagents.start(...))`，而 `dsh-subagent` 的
#      `start()` 固定发 `mode: "one-shot"` 描述符；一次性子代理**不进 `list_agents`**
#      （`dsh-tool-subagent-control` 的 `list-agents`：`entry.mode !== 'continuable'` 直接丢弃）、
#      `send_message` 报 `NOT_RESUMABLE` —— 一次阻塞就把规则 6 / 7 省下的"重读"退回原价。
#      **没有阻塞例外**：前台并不让它更快拿到结果 —— 后台子代理结束时，运行时会构造一条
#      `kind: "subagent-settled"` 的通知消息（带它的收尾正文）投递给直接父级，且投递是**唤醒型**的
#      （`notifySettlement` → `sendWaking(parent, message, parent.status === "idle" ? "queue" : "steer")`），
#      所以调度者直接结束本轮即可，结果回来会把它重新唤起。（初稿曾写"唯一例外"，2026-09-28 按用户指出纠正。）
#      **它只能是提示级的**：框架没有"只能后台"的开关（`enableRunInBackground: false` 是反方向，
#      会强制永远阻塞 + 永远一次性），而 `run_in_background` 的默认值本来就是 true
#      （`request.run_in_background ?? options.continuable`），所以只在 persona 里立这条口径。
#      代价 +429 字符：`prefix` 正文（`|-` 之后的正文行、不含换行）实测 7219（同日纠正"唯一例外"时又改过
#      措辞，初版是 +366 / 7156）—— 顶注第 10 条记的
#      4820 是那一次改动之后的旧值，其后的规则 16 / 17 与 2026-09-27 的两处追加没有登记。
#  14. 调度 persona 规则 7 补 `status` 判据与"`running` 三分支"（2026-09-29 按用户要求）：原规则只写
#      "（空闲的、以及已结束但可恢复的都能接）"—— 复用前提是**隐式**的，而 `send_message` 的说明读起来
#      无害，于是调度者把"复用同一位专家"执行成了"向**正在工作**的它发消息"，**插进它当前任务那一轮**：
#      新问题与原任务的收尾会合并进同一条 closing message，而结算通知带的正是这段合并文本，事后分不清
#      哪半句答的是哪件事（做验证的那一轮还可能被新诉求带偏原验收标准）。源码依据（**源码级事实**，
#      非实测）：模型侧 `send_message` 的唯一通路是 `dsh-tool-subagent-control` 的
#      `ctx.subagents.sendMessage(...)`，它**没有 delivery 参数**，包内固定
#      `deliverToChild(..., { delivery: "steer" })`；两种投递的落点分别是 `agent.steer()` →
#      `inbox.nextStep`（插进**当前轮的下一步**）与 `agent.followup()` → `inbox.nextTurn`，而 queue
#      只在宿主级 `queuePrompt` 里，模型侧拿不到。所以规则 7 现在要求先用 `list_agents` 看 status
#      （它只有 `running` / `inactive` 两态、**不含进度**，所以判据只能是新输入与在飞任务的**语义关系**，
#      不能是"它快做完了"）：`inactive` → 照旧 `send_message`（无当前轮时 steer 退化为开新轮，沿用
#      已持久化会话）；`running` → ① 修正/补充同一件事就现在发（steer 的本用，比重派省下整个"重读 + 步数"）
#      ② 同一实体上的**另一件事**就不插进去：结束本轮、等**结算通知**把它唤起（结算是自动的，不要为看
#      进度去轮询 `list_agents`），再接给同一个它 ③ 取代在飞任务先 `interrupt_agent` 停当前轮再发。
#      **未观测**：真实会话里调度者是否照做（量法与 I13 N3 同批）。代价 +517 字符：`prefix` 正文
#      （`|-` 之后的正文行、不含换行）实测 7736（本次改动前 7219）。
#  15. 交付形态与截断接续（2026-09-29 按用户要求；本轮有两个写者，本条合并两侧口径，2026-09-29 19:0x 复核）。
#      现象（用户实测）：子代理的单条回复撞 `maxTokens` 时，DSH 中断**那一轮**并把已写出的部分留在对话里，
#      界面上的文案是「已达到输出 token 上限回答被截断，已有输出保留在对话中。发送"继续"可让模型接着输出。」。
#      机制（源码级事实，见 docs/evidence.md §21）：撞上限是 `{kind:"max-tokens"}` 的**正常结局**、
#      不抛错、不走 `agent/request-error`（所以没有任何内建重试）；`@deepseek-ai/dsh-agent-loop/lib/index.js:1136`
#      在**执行这一轮 tool-call 之前** return，所以这一轮未派发的工具调用随 `@deepseek-ai/dsh-llm/lib/index.js:1053`
#      被整体丢弃（丢的是"未完成的工具调用"，不是已写出的文本）；本机 profile 走 pi-ai 适配器，
#      单条上限是 `DEFAULT_MAX_TOKENS = 32768`（`@deepseek-ai/dsh-llm-pi-ai/lib/index.js:925`；
#      与上下文窗口 262144 是两件事）；用户看到的提示是**客户端合成**的渲染（`@deepseek-ai/dsh-client-ui-chat/lib/client.js:1318-1333`），
#      **没有"一键继续"按钮或命令**，而被委派的子代理**自己发不了**那条"继续" —— 所以能推动下一轮的
#      只有调度者自己的 `send_message`。**父级拿得到截断前的部分产出**：工具返回的文本是
#      "subagent run hit its token limit before finishing"，但会把保留的部分答案附在错误里
#      （`@deepseek-ai/dsh-tool-subagent/lib/index.js:292` / `:297-305`），所以口径是"先消费部分产出，再决定续跑还是换人"，
#      **不是**"重派一个新专家从头做"。三处改动：① 规则 5 的**期望产出**里写明"产出大时分段交付"
#      （先给结论 / 证据位置 / 未验证的梗概，再分段给大正文）；② 规则 7 补**接续**半条 ——
#      被截断时**立刻** `send_message` 接给**同一个它**、请它从断点续写，"换人"只留给"它已无法接续"
